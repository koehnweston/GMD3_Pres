        <style>
            .fullscreen-iframe {
                position: fixed !important; 
                top: 0 !important; 
                left: 0 !important;
                width: 100vw !important; 
                height: 100vh !important;
                z-index: 9999999 !important; 
                background-color: white !important;

        <script>
            function openFullscreenIframe(iframe) {
                if (!iframe) return;
                if (!iframe.classList.contains('fullscreen-iframe')) {
                    var placeholder = document.createElement('div');
                    placeholder.id = 'iframe-placeholder';
                    iframe.parentNode.insertBefore(placeholder, iframe);
                    document.body.appendChild(iframe);
                    iframe.classList.add('fullscreen-iframe');
                }
            }

            function closeFullscreenIframe() {
                var activeIframe = document.querySelector('body > iframe.fullscreen-iframe');
                if (activeIframe) {
                    var placeholder = document.getElementById('iframe-placeholder');
                    if (placeholder && placeholder.parentNode) {
                        placeholder.parentNode.insertBefore(activeIframe, placeholder);
                        placeholder.parentNode.removeChild(placeholder);
                    }
                    activeIframe.classList.remove('fullscreen-iframe');
                }
                for (var key in window) {
                    if (window[key] instanceof L.Map) {
                        window[key].closePopup();
                    }
                }
            }

            // Handshake message listener
            window.addEventListener('message', function(e) {
                if (e.data === 'close_report_fullscreen') {
                    closeFullscreenIframe();
                } else if (e.data && e.data.type === 'request_pivot_assignments') {
                    // Report iframe is asking for assignments immediately upon loading!
                    document.querySelectorAll('iframe').forEach(function(ifr) {
                        try {
                            ifr.contentWindow.postMessage({
                                type: 'pivot_assignments_updated',
                                assignments: window.pivotAssignments || {}
                            }, '*');
                        } catch(err) {}
                    });
                }
            });

            // When a popup opens, immediately expand to fullscreen and push assignments
            setTimeout(function() {
                for (var key in window) {
                    if (window[key] instanceof L.Map) {
                        var mapInstance = window[key];
                        mapInstance.on('popupopen', function(e) {
                            var popupEl = e.popup.getElement();
                            if (popupEl) {
                                var iframe = popupEl.querySelector('iframe');
                                if (iframe) {
                                    openFullscreenIframe(iframe);
                                    
                                    // Actively push assignments repeatedly during load
                                    [100, 300, 600, 1000].forEach(function(delay) {
                                        setTimeout(function() {
                                            try {
                                                iframe.contentWindow.postMessage({
                                                    type: 'pivot_assignments_updated',
                                                    assignments: window.pivotAssignments || {}
                                                }, '*');
                                            } catch(err) {}
                                        }, delay);
                                    });
                                }
                            }
                        });
                        break;
                    }
                }
            }, 800);
        </script>

        <script>
            window.searchDataMap = {"wrfns": {"29674": 3, "20119444-DT": 3, "29674-D1": 3, "29674-D2": 3, "28806": 3, "275": 3, "11439": 3, "11440": 3}, "pdivs": {"25717": 3, "44043": 3, "68735": 3, "74156": 3}};
            
            // Auto-load pre-baked assignments from Python if available
            window.pivotAssignments = {};

            function toggleAssignmentPanel() {
                var panel = document.getElementById('assignment-panel');
                panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
            }

            function toggleMeterPanel() {
                var panel = document.getElementById('meter-panel');
                panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
            }

            function broadcastAssignmentsToIframes() {
                try {
                    localStorage.setItem('kda_pivot_assignments', JSON.stringify(window.pivotAssignments));
                } catch(e) {}
                
                document.querySelectorAll('iframe').forEach(function(ifr) {
                    try {
                        ifr.contentWindow.postMessage({
                            type: 'pivot_assignments_updated',
                            assignments: window.pivotAssignments
                        }, '*');
                    } catch(err) {}
                });
            }

            function refreshAssignmentTable() {
                let html = '<tr style="background: #f3f4f6;"><th style="padding: 4px; border-bottom: 1px solid #ccc;">Pivot ID</th><th style="padding: 4px; border-bottom: 1px solid #ccc;">Covered Tracts</th><th style="padding: 4px; border-bottom: 1px solid #ccc;">PDIVs</th><th style="padding: 4px; border-bottom: 1px solid #ccc; width: 20px;"></th></tr>';
                let count = 0;
                for (let pid in window.pivotAssignments) {
                    count++;
                    html += `<tr><td style="padding: 4px; border-bottom: 1px solid #eee; font-weight: bold;">${pid}</td><td style="padding: 4px; border-bottom: 1px solid #eee; font-size: 9px; color: #666;">${window.pivotAssignments[pid].trs}</td><td style="padding: 4px; border-bottom: 1px solid #eee; font-weight: bold; color: #2563eb;">${window.pivotAssignments[pid].pdivs}</td><td style="padding: 4px; border-bottom: 1px solid #eee; text-align: center;"><button onclick="deleteAssignment('${pid}')" title="Remove Assignment" style="background: none; border: none; color: #ef4444; cursor: pointer; font-weight: bold; font-size: 14px; padding: 0;">✕</button></td></tr>`;
                }
                if (count === 0) { html += '<tr id="empty-row"><td colspan="4" style="text-align:center; padding: 10px; color: #9ca3af;">No assignments made yet.</td></tr>'; }
                document.getElementById('assignment-table').innerHTML = html;
            }
            
            function deleteAssignment(pivotId) { 
                delete window.pivotAssignments[pivotId]; 
                refreshAssignmentTable(); 
                broadcastAssignmentsToIframes();
            }
            
            function assignPivotToWell(pivotId, trsList, selectId, btnElement) {

                for (var i = 0; i < select.options.length; i++) {

                        selectedPdivs.push(select.options[i].value);
                    }
                }
                
                if (selectedPdivs.length === 0) {

                window.pivotAssignments[pivotId] = {trs: trsList, pdivs: selectedPdivs.join(', ')};
                
                refreshAssignmentTable();
                broadcastAssignmentsToIframes();

                for (var key in window) {

                        btnElement.innerText = originalText; 
                        btnElement.style.backgroundColor = "#2563eb"; 
                    }, 1500);
                }
            }
            
            function exportAssignmentsCSV() {
                if (Object.keys(window.pivotAssignments).length === 0) { alert("Please make at least one assignment before downloading."); return; }
                let csv = 'Pivot_ID,Covered_Tracts,Assigned_PDIVs\n';
                for (let pid in window.pivotAssignments) { csv += `${pid},"${window.pivotAssignments[pid].trs}","${window.pivotAssignments[pid].pdivs}"\n`; }
                let blob = new Blob([csv], {type: 'text/csv'}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Wetted_Acre_Assignments.csv'; a.click();
            }

            function importAssignmentsCSV(input) {
                var file = input.files[0];
                if (!file) return;
                var reader = new FileReader();
                reader.onload = function(e) {
                    var text = e.target.result;
                    var lines = text.split(/\r\n|\n/);
                    var loaded = 0;
                    for (var i = 1; i < lines.length; i++) {
                        var line = lines[i].trim();
                        if (!line) continue;
                        var parts = line.split(',');
                        if (parts.length >= 3) {
                            var pId = parts[0].replace(/"/g, '').trim();
                            var trs = parts[1].replace(/"/g, '').trim();
                            var pdivs = parts.slice(2).join(',').replace(/"/g, '').trim();
                            if (pId && pdivs) {
                                window.pivotAssignments[pId] = {trs: trs, pdivs: pdivs};
                                loaded++;
                            }
                        }
                    }
                    refreshAssignmentTable();
                    broadcastAssignmentsToIframes();
                    alert("✅ Successfully loaded " + loaded + " Pivot Assignments from CSV!");
                };
                reader.readAsText(file);
            }

            function executeSearch() {
                var query = document.getElementById('map-search-bar').value.trim().toUpperCase();
                if (!query) return;
                
                var foundGid = null;
                if (window.searchDataMap.pdivs[query]) {
                    foundGid = window.searchDataMap.pdivs[query];
                } else {
                    for (var w in window.searchDataMap.wrfns) {
                        if (w.toUpperCase().includes(query)) {
                            foundGid = window.searchDataMap.wrfns[w];
                            break;
                        }
                    }
                }
                
                if (foundGid) {
                    document.getElementById('search-result-msg').innerHTML = "<span style='color:#10b981;'>Found in Group " + foundGid + "</span>";
                    for (var key in window) {
                        if (window[key] instanceof L.Map) {
                            window[key].eachLayer(function(layer) {
                                if (layer.feature && layer.feature.properties && layer.feature.properties.grp_id === foundGid) {
                                    if (layer instanceof L.Path) {
                                        layer.setStyle({fillOpacity: 0.4, weight: 6, color: '#fbbf24'});
                                        setTimeout(() => {
                                            layer.setStyle({fillOpacity: 0.05, weight: 3, color: layer.options.originalColor || '#3b82f6'});
                                        }, 5000);
                                    }
                                }
                            });
                        }
                    }
                    document.querySelectorAll('.pdiv-blink-target-' + foundGid).forEach(function(el) {
                        el.classList.add('is-blinking');
                        setTimeout(() => { el.classList.remove('is-blinking'); }, 5000);
                    });
                } else {
                    document.getElementById('search-result-msg').innerHTML = "<span style='color:#ef4444;'>Not Found</span>";
                }
            }

            let meterWorkbookFolium = null;
            let matchedMeterPdivsFolium = new Set();
            
            document.getElementById('meterUploadFolium').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                document.getElementById('meterStatusFolium').innerText = "Parsing Excel File...";
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    meterWorkbookFolium = XLSX.read(data, {type: 'array'});
                    matchedMeterPdivsFolium.clear();
                    let validPdivs = Object.keys(window.searchDataMap ? window.searchDataMap.pdivs : {});
                    if (meterWorkbookFolium.SheetNames.length > 0) {
                        const firstSheet = meterWorkbookFolium.Sheets[meterWorkbookFolium.SheetNames[0]];
                        const jsonData = XLSX.utils.sheet_to_json(firstSheet);
                        jsonData.forEach(row => {
                            const pid = String(parseInt(row['PDIV']));
                            if (validPdivs.includes(pid)) {
                                matchedMeterPdivsFolium.add(pid);
                            }
                        });
                    }
                    if (matchedMeterPdivsFolium.size > 0) {
                        document.getElementById('meterStatusFolium').innerHTML = `✅ Mapped ${matchedMeterPdivsFolium.size} PDIVs from map to file.`;
                        const select = document.getElementById('meterPdivSelectFolium');
                        select.innerHTML = '';
                        Array.from(matchedMeterPdivsFolium).sort((a,b) => a - b).forEach(pid => {
                            const opt = document.createElement('option');
                            opt.value = pid; opt.text = `PDIV ${pid}`;
                            select.appendChild(opt);
                        });
                        document.getElementById('meterControlsFolium').style.display = 'block';
                        renderMeterChartFolium();
                    } else {
                        document.getElementById('meterStatusFolium').innerHTML = `<span style='color:#ef4444;'>⚠️ No matching PDIVs found in file.</span>`;
                    }
                };
                reader.readAsArrayBuffer(file);
            });

            function renderMeterChartFolium() {
                if (!meterWorkbookFolium) return;
                const selectedPdiv = document.getElementById('meterPdivSelectFolium').value;
                const traces = [];
                meterWorkbookFolium.SheetNames.forEach(year => {
                    const sheet = meterWorkbookFolium.Sheets[year];
                    const jsonData = XLSX.utils.sheet_to_json(sheet);
                    const row = jsonData.find(r => String(parseInt(r['PDIV'])) === selectedPdiv);
                    if (row) {
                        const dateKeys = Object.keys(row).filter(k => k !== 'PDIV' && k !== 'Well ID' && k !== 'Well Name');
                        dateKeys.sort((a, b) => {
                            const [m1, d1] = a.split('/').map(Number);
                            const [m2, d2] = b.split('/').map(Number);
                            if (m1 !== m2) return m1 - m2;
                            return d1 - d2;
                        });
                        const yValues = dateKeys.map(k => parseFloat(row[k]) || 0);
                        traces.push({
                            x: dateKeys, y: yValues, mode: 'lines+markers', type: 'scatter', name: String(year),
                            line: {width: 2}, marker: {size: 6}, hovertemplate: `<b>${year}</b><br>Date: %{x}<br>Cum. Use: <b>%{y:.2f} AF</b><extra></extra>`
                        });
                    }
                });
                const layout = {
                    margin: {l: 50, r: 20, t: 40, b: 40},
                    title: {text: "Cumulative Usage (Acre-Feet)", font: {size: 14}},
                    xaxis: {tickfont: {size: 10, weight: 'bold'}, showgrid: true, gridcolor: '#e5e7eb'},
                    yaxis: {tickfont: {size: 12}, rangemode: 'tozero', showgrid: true, gridcolor: '#e5e7eb'},
                    legend: {orientation: "h", yanchor: "top", y: -0.2, xanchor: "center", x: 0.5},
                    hovermode: "x unified", paper_bgcolor: 'white', plot_bgcolor: 'white'
                };
                Plotly.newPlot('meterChartFolium', traces, layout, {displayModeBar: false, responsive: true});
            }

            setTimeout(function() {
                refreshAssignmentTable();
                broadcastAssignmentsToIframes();

                for (var key in window) {
                    if (window[key] instanceof L.Map) {
                        var mapInstance = window[key];

                        function syncMapZoom() {
                            var z = mapInstance.getZoom();
                            var container = mapInstance.getContainer();
                            
                            container.className = container.className.replace(/\bzoom-\d+\b/g, '').trim();
                            container.classList.add('zoom-' + z);
                            
                            var dynamicRadius = (z <= 8) ? 2.5 : ((z <= 10) ? 4.0 : ((z <= 12) ? 5.5 : ((z <= 14) ? 7.0 : 8.5)));
                            var dynamicWeight = (z <= 9) ? 1.0 : 2.0;
                            
                            mapInstance.eachLayer(function(layer) {
                                if (layer instanceof L.CircleMarker && layer.options.className === 'pdiv-svg-marker') {
                                    layer.setRadius(dynamicRadius);
                                    layer.setStyle({ weight: dynamicWeight });
                                }
                            });
                        }

                        mapInstance.on('zoomend', syncMapZoom);
                        syncMapZoom();

                        mapInstance.eachLayer(function(layer) {
                            if (layer.feature && layer.feature.properties && layer.feature.properties.grp_id !== undefined) {
                                var gid = layer.feature.properties.grp_id;
                                if (layer instanceof L.Path) {
                                    layer.on('mouseover', function(e) { e.target.setStyle({fillOpacity: 0.3, weight: 4, color: '#fbbf24'}); document.querySelectorAll('.pdiv-blink-target-' + gid).forEach(function(el) { el.classList.add('is-blinking'); }); });
                                    layer.on('mouseout', function(e) { e.target.setStyle({fillOpacity: 0.05, weight: 3, color: layer.options.originalColor || e.target.options.color}); document.querySelectorAll('.pdiv-blink-target-' + gid).forEach(function(el) { el.classList.remove('is-blinking'); }); });
                                    layer.options.originalColor = layer.options.color;
                                }
                            }
                        });
                        break; 
                    }
                }
            }, 1000);
